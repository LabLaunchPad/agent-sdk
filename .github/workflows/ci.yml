name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the `packageManager` field, so CI and local cannot drift.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Record toolchain baseline
        # A green run on the wrong Node version is not evidence. Print what
        # actually ran so the receipt can cite it.
        run: |
          node -v
          pnpm -v
          pnpm exec tsc -v

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        # Check only. CI never rewrites source.
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # The seven mandatory validators run as separate steps so a red CI names
      # the failing check without anyone reading the log.
      - name: 'Validator 1/7 — schema-contract'
        run: node scripts/repo-tools/dist/cli.js validate schema-contract

      - name: 'Validator 2/7 — package-boundary'
        run: node scripts/repo-tools/dist/cli.js validate package-boundary

      - name: 'Validator 3/7 — context-staleness'
        # Mandatory, never advisory. `context refresh` must NOT run here:
        # auto-refresh would rubber-stamp drift instead of reporting it.
        run: node scripts/repo-tools/dist/cli.js validate context-staleness

      - name: 'Validator 4/7 — okf-conformance'
        # Added in Workstream A but never wired into this file until Phase 1B
        # found the gap: every OKF concept under .context/research/specs/ADR
        # was unenforced in CI, only checked locally via `pnpm validate`.
        run: node scripts/repo-tools/dist/cli.js validate okf-conformance

      - name: 'Validator 5/7 — package-exports (publication smoke test)'
        # Packs the tarball, installs it into a clean consumer, imports by public
        # package name and executes an export.
        run: node scripts/repo-tools/dist/cli.js validate package-exports

      - name: 'Validator 6/7 — repository-policy'
        run: node scripts/repo-tools/dist/cli.js validate repository-policy

      - name: 'Validator 7/7 — research-integrity'
        # Added in Phase 1B: ID cross-references in research/canonical/
        # canonical-research.json and relative markdown links across the OKF
        # scopes actually resolve. okf-conformance-validator is explicitly
        # required by the OKF v0.2 spec to tolerate broken links, so this is a
        # separate check under its own rule namespace, not a stricter
        # okf-conformance.
        run: node scripts/repo-tools/dist/cli.js validate research-integrity
